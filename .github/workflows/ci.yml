name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-dataset:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install tree-sitter tree-sitter-c

      - name: Verify dataset structure
        run: |
          echo "Dataset files:"
          wc -l zephyr-bench/zephyr_tasks.c.jsonl
          wc -l zephyr-bench/zephyr_tasks.h.jsonl
          echo "Oracles count:"
          ls zephyr-bench/oracles/ | wc -l
          echo "Python import check:"
          python3 -c "
            from tree_sitter import Language, Parser
            import tree_sitter_c
            print('tree-sitter OK')
          "

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python files
        run: ruff check zephyr-claude/
